server {
    listen       80;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    # ── Compression ───────────────────────────────────────────────────────────
    gzip            on;
    gzip_comp_level 6;
    gzip_types      text/plain text/css application/javascript
                    application/json image/svg+xml;

    # ── Cache policy ──────────────────────────────────────────────────────────
    # Vite fingerprints all bundled assets (e.g. index-Bx3kT9.js), so they
    # can be cached indefinitely.  Only index.html must not be cached so the
    # browser always fetches the latest entry point.
    location ~* \.(js|css|png|jpg|ico|woff2?)$ {
        expires     1y;
        add_header  Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header  Cache-Control "no-store";
    }

    # ── SPA fallback ──────────────────────────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }
}
